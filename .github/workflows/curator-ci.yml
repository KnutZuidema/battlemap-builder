name: Curator CI

on:
  pull_request:
    paths:
      - 'curator/src/**'
      - 'curator/src/ui/**'
      - 'curator/tests/**'
      - 'curator/migrations/**'
      - 'curator/Cargo.toml'
      - 'curator/Cargo.lock'
      - 'curator/Dockerfile'
      - 'data/battlemap-reference-*'
      - '.dockerignore'
      - '.github/workflows/curator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build_image: ${{ steps.filter.outputs.build_image }}
      run_tests: ${{ steps.filter.outputs.run_tests }}
      run_ui: ${{ steps.filter.outputs.run_ui }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changes to source code and tests
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build_image:
              - 'curator/src/**'
              - 'curator/migrations/**'
              - 'curator/Cargo.toml'
              - 'curator/Cargo.lock'
              - 'curator/Dockerfile'
              - 'data/battlemap-reference-*'
              - '.dockerignore'
              - '.github/workflows/curator-ci.yml'
            run_tests:
              - 'curator/src/**'
              - 'curator/tests/**'
              - 'curator/migrations/**'
              - 'curator/Cargo.toml'
              - 'curator/Cargo.lock'
              - 'data/battlemap-reference-*'
              - '.github/workflows/curator-ci.yml'
            run_ui:
              - 'curator/src/ui/**'
              - '.github/workflows/curator-ci.yml'

  test:
    name: Test & Lint
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    services:
      minio:
        image: alpine/minio:latest-release
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: --user 0:0
    env:
      MINIO_ENDPOINT: http://127.0.0.1:9000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: curator -> target

      - name: Check & Test
        run: cargo test --manifest-path curator/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path curator/Cargo.toml -- -D warnings

  test-ui:
    name: UI Tests
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.run_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run UI unit tests
        run: node --test curator/src/ui/tests/*.test.js

  build-container:
    name: Build Container
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.build_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: curator/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
