name: Curator CI

on:
  pull_request:
    paths:
      - 'curator/**'
      - 'deploy/curator/**'
      - 'data/battlemap-reference-*'
      - '.github/workflows/curator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build_image: ${{ steps.filter.outputs.build_image }}
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changes to source code and tests
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build_image:
              - 'curator/src/**'
              - 'curator/Cargo.toml'
              - 'curator/Cargo.lock'
              - 'curator/Dockerfile'
              - 'data/battlemap-reference-*'
            run_tests:
              - 'curator/src/**'
              - 'curator/tests/**'
              - 'curator/Cargo.toml'
              - 'curator/Cargo.lock'
              - 'data/battlemap-reference-*'

  test:
    name: Test & Lint
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: curator -> target

      - name: Check & Test
        run: cargo test --manifest-path curator/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path curator/Cargo.toml -- -D warnings

  build-container:
    name: Build Container
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.build_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: curator/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
