apiVersion: apps/v1
kind: Deployment
metadata:
  name: curator
  namespace: curator
  labels:
    app: curator
    app.kubernetes.io/name: curator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: curator
  template:
    metadata:
      labels:
        app: curator
        app.kubernetes.io/name: curator
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: curator-storage
              mountPath: /data
      containers:
        - name: curator
          image: ghcr.io/knutzuidema/curator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            - name: PORT
              value: "3002"
            - name: DATA_DIR
              value: "/data"
            - name: RUST_LOG
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: DATABASE_URL
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: HF_TOKEN
                  optional: true
            - name: MODAL_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: MODAL_TOKEN_ID
                  optional: true
            - name: MODAL_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: MODAL_TOKEN_SECRET
                  optional: true
            - name: CURATOR_MODAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: CURATOR_MODAL_ENDPOINT
                  optional: true
            - name: CURATOR_MODAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: CURATOR_MODAL_TOKEN
                  optional: true
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_ACCOUNT_ID
                  optional: true
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_ACCESS_KEY_ID
                  optional: true
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_SECRET_ACCESS_KEY
                  optional: true
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_BUCKET_NAME
                  optional: true
            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_ENDPOINT
                  optional: true
            - name: R2_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_PUBLIC_URL
                  optional: true
            - name: WAVESPEED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: WAVESPEED_API_KEY
                  optional: true
            - name: REDDIT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: REDDIT_CLIENT_ID
                  optional: true
            - name: REDDIT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: REDDIT_CLIENT_SECRET
                  optional: true
            - name: REDDIT_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: REDDIT_REFRESH_TOKEN
                  optional: true
            - name: REDDIT_USER_AGENT
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: REDDIT_USER_AGENT
                  optional: true
          volumeMounts:
            - name: curator-storage
              mountPath: /data
          resources:
            requests:
              # 100m left the pod starved by node CFS during contention: probe requests missed
              # their deadline and kubelet killed a healthy container. 250m keeps the event loop
              # schedulable while the 1000m limit still caps burst work.
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /api/healthz
              port: 3002
            periodSeconds: 5
            timeoutSeconds: 5
            # Catalog migrations on first boot can take a minute; a startup probe keeps that out
            # of the liveness failure budget.
            failureThreshold: 24
          # Liveness only catches a wedged process: restarting a healthy pod severs in-flight
          # exports, freezes and triage work, and the retry then hits the fresh container. The
          # budget below is 8 x 15s = 120s of sustained unresponsiveness before a restart.
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3002
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 8
          # Readiness stays tight: shedding ingress is cheap and reversible, unlike a restart.
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3002
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: curator-storage
          persistentVolumeClaim:
            claimName: curator-data-pvc
