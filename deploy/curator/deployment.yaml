apiVersion: apps/v1
kind: Deployment
metadata:
  name: curator
  namespace: curator
  labels:
    app: curator
    app.kubernetes.io/name: curator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: curator
  template:
    metadata:
      labels:
        app: curator
        app.kubernetes.io/name: curator
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: curator-storage
              mountPath: /data
      containers:
        - name: curator
          image: ghcr.io/knutzuidema/curator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            - name: PORT
              value: "3002"
            - name: DATA_DIR
              value: "/data"
            - name: RUST_LOG
              value: "info"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: REDDIT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: REDDIT_CLIENT_ID
                  optional: true
            - name: REDDIT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: REDDIT_CLIENT_SECRET
                  optional: true
            - name: REDDIT_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: REDDIT_REFRESH_TOKEN
                  optional: true
            - name: REDDIT_USER_AGENT
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: REDDIT_USER_AGENT
                  optional: true
          volumeMounts:
            - name: curator-storage
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/status
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/status
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: curator-storage
          persistentVolumeClaim:
            claimName: curator-data-pvc
