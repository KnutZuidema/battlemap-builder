apiVersion: batch/v1
kind: Job
metadata:
  name: curator-storage-migration
  namespace: curator
  labels:
    app: curator-storage-migration
    app.kubernetes.io/name: curator-storage-migration
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: curator-storage-migration
        app.kubernetes.io/name: curator-storage-migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: migration
          image: ghcr.io/knutzuidema/curator:latest
          imagePullPolicy: IfNotPresent
          args: ["migrate-disk-to-s3"]
          env:
            - name: DATA_DIR
              value: "/data"
            - name: RUST_LOG
              value: "info"
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_ACCOUNT_ID
                  optional: true
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_ACCESS_KEY_ID
                  optional: true
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_SECRET_ACCESS_KEY
                  optional: true
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_BUCKET_NAME
                  optional: true
            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_ENDPOINT
                  optional: true
            - name: R2_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: curator-secrets
                  key: R2_PUBLIC_URL
                  optional: true
          volumeMounts:
            - name: curator-storage
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: curator-storage
          persistentVolumeClaim:
            claimName: curator-data-pvc
