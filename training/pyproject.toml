[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dungeonforge-training"
version = "0.1.0"
description = "ai-toolkit configuration and run policy engine for Dungeon Forge LoRA fine-tuning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
dungeonforge-training = "dungeonforge_training.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dungeonforge_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
